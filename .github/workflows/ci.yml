name: CI

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (portable exe，tag 发布用)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (dir only, 校验打包)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run build:dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: YoimiyaWidget-portable
          path: dist/YoimiyaWidget.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: YoimiyaWidget-portable
          path: dist

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum YoimiyaWidget.exe > YoimiyaWidget.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YoimiyaWidget.exe
            dist/YoimiyaWidget.exe.sha256
