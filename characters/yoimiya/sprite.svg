<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!--
    原创矢量角色「烟花少女」v1 —— 代码手绘（P1-B1 替代方案）
    · 设计：暖橙双马尾 + 红色蝴蝶结 + 白羽织（火焰纹镶边）+ 绀色和服裙 + 线香花火
    · 天然透明背景，无需抠图；内置眨眼 / 呆毛摇摆 / 花火闪烁 / 挥手动画
    · 分组 id/class：.eyes 眨眼  #mouth 口型  .arm-wave 挥手  .ahoge 呆毛  .spark 花火
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF4B0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFC24D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8AB5E"/>
      <stop offset="1" stop-color="#EE8A3C"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C040"/>
      <stop offset="1" stop-color="#E8753A"/>
    </linearGradient>
    <style>
      .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
      @keyframes blink {
        0%, 91%, 100% { transform: scaleY(1); }
        94%           { transform: scaleY(0.08); }
        97%           { transform: scaleY(1); }
      }
      .ahoge { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.4s ease-in-out infinite; }
      @keyframes sway {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(5deg); }
      }
      .spark { transform-box: fill-box; transform-origin: 50% 50%; animation: flicker 0.8s steps(2, end) infinite; }
      @keyframes flicker {
        0%   { opacity: 1;    transform: scale(1); }
        50%  { opacity: 0.72; transform: scale(0.86); }
        100% { opacity: 1;    transform: scale(1.06); }
      }
      .arm-wave { transform-box: fill-box; transform-origin: 8% 92%; animation: wave 3.2s ease-in-out infinite; }
      @keyframes wave {
        0%, 52%, 100% { transform: rotate(0deg); }
        12%           { transform: rotate(-16deg); }
        24%           { transform: rotate(8deg); }
        36%           { transform: rotate(-14deg); }
        46%           { transform: rotate(0deg); }
      }
      #mouth { transform-box: fill-box; transform-origin: 50% 0%; animation: talk 5.5s ease-in-out infinite; }
      @keyframes talk {
        0%, 30%, 100% { transform: scaleY(1); }
        36%           { transform: scaleY(0.55); }
        42%           { transform: scaleY(1.15); }
      }
    </style>
  </defs>

  <g stroke="#4A2A1A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- ============ 双马尾（在头部之后） ============ -->
    <g id="tail">
      <path d="M150 128 C104 146 80 204 86 268 C90 308 106 338 132 350 C120 318 120 280 128 244 C136 206 150 172 168 152 Z" fill="url(#hair)"/>
      <path d="M116 196 C106 240 108 288 122 322" fill="none" stroke="#FFC98A" stroke-width="7" opacity="0.75"/>
    </g>
    <use href="#tail" transform="translate(480 0) scale(-1 1)"/>

    <!-- ============ 身体 ============ -->
    <!-- 脖子 -->
    <path d="M228 278 L228 306 C236 310 244 310 252 306 L252 278 Z" fill="#FFE4D0"/>
    <path d="M228 280 L252 280 L252 292 C244 296 236 296 228 292 Z" fill="#F5C9AE" stroke="none"/>
    <!-- 羽织（白色外套） -->
    <path d="M198 298 C180 304 172 326 174 356 L180 388 C220 396 260 396 300 388 L306 356 C308 326 300 304 282 298 C268 308 212 308 198 298 Z" fill="#FFF9F0"/>
    <!-- 衣领 V 区（内搭绀色） -->
    <path d="M220 296 L240 350 L260 296 Z" fill="#2F3A5F"/>
    <!-- 左右衣襟 + 火焰纹镶边 -->
    <path d="M192 298 L226 360 L242 350 L210 292 Z" fill="#FFF9F0"/>
    <path d="M288 298 L254 360 L238 350 L270 292 Z" fill="#FFF9F0"/>
    <path d="M212 296 L240 350 M268 296 L240 350" fill="none" stroke="url(#trim)" stroke-width="4"/>
    <!-- 腰带 -->
    <rect x="180" y="386" width="120" height="16" rx="5" fill="#D44040"/>
    <circle cx="240" cy="394" r="7" fill="#F0C040"/>
    <!-- 腿 -->
    <rect x="216" y="438" width="18" height="22" rx="8" fill="#FFE4D0"/>
    <rect x="246" y="438" width="18" height="22" rx="8" fill="#FFE4D0"/>
    <!-- 和服裙摆 -->
    <path d="M182 400 L298 400 L308 442 C262 452 218 452 172 442 Z" fill="#2F3A5F"/>
    <path d="M214 406 L208 446 M240 406 L240 450 M266 406 L272 446" fill="none" stroke="#46558A" stroke-width="3"/>
    <!-- 木屐 -->
    <ellipse cx="225" cy="462" rx="15" ry="7" fill="#D44040"/>
    <ellipse cx="255" cy="462" rx="15" ry="7" fill="#D44040"/>

    <!-- ============ 左臂（下垂，持线香花火） ============ -->
    <path d="M196 304 C176 314 164 340 166 372 L192 372 C194 348 200 326 208 312 Z" fill="#FFF9F0"/>
    <!-- 花火签 -->
    <path d="M170 398 L158 324" fill="none" stroke="#8A5A3A" stroke-width="5"/>
    <!-- 手 -->
    <circle cx="168" cy="392" r="13" fill="#FFE4D0"/>
    <!-- 花火光芒 -->
    <g class="spark">
      <circle cx="156" cy="312" r="44" fill="url(#glow)" stroke="none"/>
      <circle cx="156" cy="312" r="10" fill="#FFF6C2" stroke="#F0A030" stroke-width="2"/>
      <g fill="none" stroke="#FFD070" stroke-width="3">
        <path d="M156 280 L156 294"/><path d="M156 330 L156 344"/>
        <path d="M124 312 L138 312"/><path d="M174 312 L188 312"/>
        <path d="M134 290 L143 299"/><path d="M169 325 L178 334"/>
        <path d="M178 290 L169 299"/><path d="M143 325 L134 334"/>
      </g>
    </g>

    <!-- ============ 右臂（举起挥手） ============ -->
    <g class="arm-wave">
      <path d="M284 304 C306 298 326 282 338 262 L362 280 C348 306 326 324 300 332 Z" fill="#FFF9F0"/>
      <path d="M336 262 L360 280" fill="none" stroke="url(#trim)" stroke-width="5"/>
      <circle cx="356" cy="250" r="15" fill="#FFE4D0"/>
      <circle cx="343" cy="263" r="6" fill="#FFE4D0"/>
    </g>

    <!-- ============ 头部 ============ -->
    <!-- 后发 -->
    <circle cx="240" cy="184" r="112" fill="url(#hair)"/>
    <!-- 脸 -->
    <path d="M240 94 C300 94 340 134 342 196 C343 238 320 274 276 286 C262 289 218 289 204 286 C160 274 137 238 138 196 C140 134 180 94 240 94 Z" fill="#FFE4D0"/>
    <!-- 侧发 -->
    <path id="sidelock" d="M134 176 C126 222 130 264 150 298 C162 278 168 238 168 196 C158 186 146 178 134 176 Z" fill="url(#hair)"/>
    <use href="#sidelock" transform="translate(480 0) scale(-1 1)"/>
    <!-- 刘海 -->
    <path d="M132 200 C124 110 176 70 240 70 C304 70 356 110 348 200 C342 184 334 170 326 162 Q322 176 312 192 Q304 172 296 164 Q288 178 280 194 Q272 174 262 166 Q252 182 244 196 Q236 182 226 166 Q216 174 208 194 Q200 178 192 164 Q184 172 176 192 Q166 176 160 162 C152 170 140 184 132 200 Z" fill="url(#hair)"/>
    <!-- 发丝高光 -->
    <path d="M176 118 C196 108 216 104 236 106 M250 106 C268 108 286 114 302 124" fill="none" stroke="#FFC98A" stroke-width="7"/>
    <!-- 呆毛 -->
    <path class="ahoge" d="M226 78 C220 44 244 20 274 30 C256 34 244 50 250 74 Z" fill="url(#hair)"/>

    <!-- 五官 -->
    <g class="eyes">
      <g id="eye">
        <ellipse cx="208" cy="222" rx="21" ry="27" fill="#FFFFFF"/>
        <ellipse cx="208" cy="226" rx="15" ry="21" fill="#E8892F" stroke="none"/>
        <ellipse cx="208" cy="229" rx="7" ry="12" fill="#5A2E10" stroke="none"/>
        <circle cx="201" cy="212" r="6.5" fill="#FFFFFF" stroke="none"/>
        <circle cx="214" cy="234" r="3" fill="#FFFFFF" stroke="none"/>
        <path d="M187 212 Q208 190 229 212" fill="none" stroke="#4A2A1A" stroke-width="6"/>
      </g>
      <use href="#eye" transform="translate(480 0) scale(-1 1)"/>
    </g>
    <ellipse cx="184" cy="250" rx="17" ry="8" fill="#FF9E8A" opacity="0.6" stroke="none"/>
    <ellipse cx="296" cy="250" rx="17" ry="8" fill="#FF9E8A" opacity="0.6" stroke="none"/>
    <path d="M238 240 L243 242" fill="none" stroke-width="3"/>
    <g id="mouth">
      <path d="M226 258 Q240 282 254 258 Z" fill="#B3352E"/>
      <path d="M231 268 Q240 278 249 268 Z" fill="#F27A7A" stroke="none"/>
    </g>

    <!-- 蝴蝶结发饰（系在马尾根部） -->
    <g id="ribbon" transform="translate(-12 44)">
      <path d="M136 126 L118 160 L136 152 Z" fill="#D44040"/>
      <path d="M146 124 L158 160 L140 152 Z" fill="#D44040"/>
      <ellipse cx="116" cy="112" rx="22" ry="14" transform="rotate(-32 116 112)" fill="#D44040"/>
      <ellipse cx="148" cy="96" rx="22" ry="14" transform="rotate(38 148 96)" fill="#D44040"/>
      <circle cx="138" cy="116" r="9" fill="#B33030"/>
    </g>
    <use href="#ribbon" transform="translate(480 0) scale(-1 1)"/>
  </g>
</svg>
